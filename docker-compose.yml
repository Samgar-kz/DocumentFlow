# Local demo stack: PostgreSQL + API + web UI.
#   docker compose up --build
#   UI:  http://localhost:8081   (demo@documentflow.dev / Demo123!)
#   API: http://localhost:5090/scalar
name: documentflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: documentflow
      POSTGRES_USER: documentflow
      POSTGRES_PASSWORD: documentflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documentflow -d documentflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Database: Host=db;Port=5432;Database=documentflow;Username=documentflow;Password=documentflow
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-signing-key-change-me-0123456789}
      Database__MigrateOnStartup: "true"
      OpenApi__Enabled: "true"
      # Demo organisation for local evaluation only. Never enable seeding in a real deployment.
      Seed__Enabled: "true"
      Seed__DemoPassword: Demo123!
      Seed__AdminPassword: Admin123!
    volumes:
      - files:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5090:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  pgdata:
  files:
